name: Bug report
description: Report a reproducible problem in EL-Rouji.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please remove secrets and personal information before submitting."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the issue and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: 1. Open ...\n2. Choose ...\n3. Observe ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser/device and language
      placeholder: Android / Chrome / Arabic, for example
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant error messages
      description: Redact tokens, URLs containing private parameters, and user content.
    validations:
      required: false