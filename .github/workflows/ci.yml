name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci
      - name: Check patched selector-parser and AppDeploy Tailwind floors
        run: node scripts/check-dependency-security.mjs
      - name: Run URL safety regression tests
        run: node --experimental-strip-types --test tests/url-safety.test.mjs
      - name: Dependency audit summary
        continue-on-error: true
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          let raw = '';
          try {
            raw = execFileSync('npm', ['audit', '--json'], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] });
          } catch (error) {
            raw = String(error.stdout || '');
          }
          try {
            const audit = JSON.parse(raw);
            const vulnerabilities = Object.fromEntries(
              Object.entries(audit.vulnerabilities || {}).map(([name, item]) => [
                name,
                {
                  severity: item.severity,
                  range: item.range,
                  fixAvailable: item.fixAvailable,
                  via: (item.via || []).map((entry) => typeof entry === 'string' ? entry : entry.title),
                },
              ])
            );
            console.log(JSON.stringify({ counts: audit.metadata?.vulnerabilities, vulnerabilities }, null, 2));
          } catch {
            console.log('npm audit did not return parseable JSON; inspect the workflow logs.');
          }
          NODE
      - name: Fail on production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=low
      - name: Type check
        run: npm run typecheck
      - name: Build frontend (CI-only AppDeploy SDK shim)
        run: npm run build
        env:
          EL_ROUJI_CI_BUILD: "1"
