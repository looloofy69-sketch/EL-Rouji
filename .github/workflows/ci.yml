name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mark initial lockfile bootstrap
        if: ${{ !hashFiles('package-lock.json') }}
        run: echo "EL_ROUJI_EXPORT_LOCKFILE=true" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci
      - name: Export generated lockfile for first import
        if: env.EL_ROUJI_EXPORT_LOCKFILE == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'ci/verify-repository-build'
        run: |
          node -e 'const fs=require("fs"); const s=fs.readFileSync("package-lock.json").toString("base64"); for(let i=0;i<s.length;i+=4000) console.log("ELROUJI_LOCKFILE_CHUNK_"+i+"_"+s.slice(i,i+4000)+"_END");'
      - name: Type check
        run: npm run typecheck
      - name: Build frontend (CI-only AppDeploy SDK shim)
        run: npm run build
        env:
          EL_ROUJI_CI_BUILD: "1"
